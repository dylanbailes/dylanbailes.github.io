<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Static fallbacks; main.js syncs these from src/config.js -->
  <meta name="description" content="Engineering Portfolio - Mechanical, PCB, Firmware & Simulation Projects">
  <meta name="author" content="Dylan Bailes">
  <meta name="theme-color" content="#f4f4f1">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Engineering Portfolio">
  <meta property="og:description" content="Engineering Portfolio - Mechanical, PCB, Firmware & Simulation Projects">
  <meta property="og:url" content="https://dylanbailes.github.io">

  <title>Engineering Portfolio</title>

  <!-- Nothing-style mark: monochrome square + signal-red dot -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111110'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ff3b30'/%3E%3C/svg%3E">

  <!-- Typography: Space Grotesk (display), IBM Plex Mono (labels), DotGothic16 (dot-matrix logo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Vite entry point — everything (styles, content, behavior) is bundled here -->
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <noscript>
    <p style="padding:1rem;text-align:center">
      This site renders its content with JavaScript. Please enable it to view the portfolio.
    </p>
  </noscript>

  <!-- Skip link for accessibility -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Theme Toggle Button -->
  <button
    class="theme-toggle"
    aria-label="Toggle dark/light theme"
    title="Toggle theme"
  >
    <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="5"/>
      <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
    </svg>
    <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <!-- Header & Navigation -->
  <header class="header">
    <div class="container header__inner">
      <a href="#hero" class="logo" aria-label="Back to top">
        <span class="logo__text" data-logo-text>DylanBailes</span>
        <span class="logo__tagline" data-logo-tagline>Engineering Portfolio</span>
      </a>

      <button
        class="nav-toggle"
        aria-expanded="false"
        aria-controls="primary-navigation"
        aria-label="Toggle navigation menu"
      >
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
      </button>

      <nav id="primary-navigation" class="nav" aria-label="Primary navigation">
        <ul class="nav__list">
          <li class="nav__item"><a href="#about" class="nav__link">About</a></li>
          <li class="nav__item"><a href="#experience" class="nav__link">Experience</a></li>
          <li class="nav__item"><a href="#skills" class="nav__link">Skills</a></li>
          <li class="nav__item"><a href="#projects" class="nav__link">Projects</a></li>
          <li class="nav__item"><a href="#contact" class="nav__link">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <!-- Sections below are mounted by src/main.js from src/config.js -->

    <section id="hero" class="hero" aria-labelledby="hero-title" data-mount="hero">
      <div class="container hero__content"></div>
    </section>

    <section id="about" class="about section" aria-labelledby="about-title" data-mount="about">
      <div class="container"></div>
    </section>

    <section id="experience" class="experience section" aria-labelledby="experience-title" data-mount="experience">
      <div class="container"></div>
    </section>

    <section id="skills" class="skills section" aria-labelledby="skills-title" data-mount="skills">
      <div class="container"></div>
    </section>

    <section id="projects" class="projects section" aria-labelledby="projects-title" data-mount="projects">
      <div class="container"></div>
    </section>

    <section id="contact" class="contact section" aria-labelledby="contact-title" data-mount="contact">
      <div class="container contact__content"></div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer__barcode" aria-hidden="true"></div>
    <div class="container footer__content">
      <nav class="footer__nav" aria-label="Footer navigation">
        <a href="#about" class="footer__link">About</a>
        <a href="#experience" class="footer__link">Experience</a>
        <a href="#skills" class="footer__link">Skills</a>
        <a href="#projects" class="footer__link">Projects</a>
        <a href="#contact" class="footer__link">Contact</a>
      </nav>
      <p class="footer__copyright">
        &copy; <span id="current-year"></span> <span data-footer-name></span>. All rights reserved.
      </p>
    </div>
  </footer>
</body>
</html>
